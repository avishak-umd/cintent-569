name: release

# CINTENT >> MANUAL_TRIGGER
# on:
#   push:
#     branches:
#       - release**
#   pull_request:
#     branches:
#       - release**
on: [repository_dispatch, workflow_dispatch]

defaults:
  run:
    shell: bash
jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v5.0.0
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      
      # CINTENT >> REMOVE_CACHE
      # - name: Cache dependencies
      #   uses: actions/cache@v4.2.4
      #   id: cache
      #   with:
      #     path: ${{ env.pythonLocation }}
      #     key: ${{ runner.os }}-${{ runner.arch }}-Python-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}
      
      # CINTENT >> INSERT_CINTENT
      - uses: JavidDitty/setup-cintent@main
        with:
          profiler: "setprofile"
      
      - name: Install pip dependencies
        # CINTENT >> REMOVE_CACHE
        # if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install .[datasets,tests]
          pip cache purge

      - name: List pip dependencies
        run: pip list

      - name: Run integration checks
        run: |
          pytest -m slow --durations=10 tests/samplers
          pytest -m slow --durations=10 tests/trainers
          python -m torchgeo --help
          torchgeo --help

      # CINTENT >> INSERT_CINTENT
      - name: Upload CIntent Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.CINTENT_ARTIFACT_NAME }}
          path: ${{ env.CINTENT_LOGS }}

  notebooks:
    name: notebooks
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v5.0.0
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      # CINTENT >> REMOVE_CACHE
      # - name: Cache dependencies
      #   uses: actions/cache@v4.2.4
      #   id: cache
      #   with:
      #     path: ${{ env.pythonLocation }}
      #     key: ${{ runner.os }}-${{ runner.arch }}-Python-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}-tutorials
      
      
      # CINTENT >> INSERT_CINTENT
      - uses: JavidDitty/setup-cintent@main
        with:
          profiler: "setprofile"

      - name: Install pip dependencies
        # CINTENT >> REMOVE_CACHE
        # if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install .[docs,tests] planetary_computer pystac tensorboard h5py scikit-learn
          pip cache purge
      - name: List pip dependencies
        run: pip list
      - name: Run notebook checks
        run: pytest --nbmake --durations=10 docs/tutorials

      # CINTENT >> INSERT_CINTENT
      - name: Upload CIntent Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.CINTENT_ARTIFACT_NAME }}
          path: ${{ env.CINTENT_LOGS }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.label || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
